<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading…</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="nav-holder"></div>
<header class="hero">
  <div class="wrap">
    <div class="eyebrow">Fruits</div>
    <h1>Home-grown, in season</h1>
    <p class="tagline">Fruit from our own orchards, sold fresh as each season comes.</p>
  </div>
</header>
<section class="section">
  <div class="wrap">
    <div class="grid" id="fruits-grid"></div>
  </div>
</section>
<div id="about-holder"></div>
<footer><div class="wrap">Built with a static site + admin panel. Edit everything from <a href="/admin/">/admin</a>.</div></footer>
<script src="common.js"></script>
<script>
document.getElementById('nav-holder').innerHTML = renderNav('fruits');
loadSite(data => {
  document.getElementById('fruits-grid').innerHTML = data.fruits.map(f => fruitCard(f, data.site.whatsapp)).join('') || '<p>Nothing in season right now — add fruit from /admin.</p>';
  document.getElementById('about-holder').innerHTML = renderAboutContact(data.site);
});
</script>
</body>
</html>
